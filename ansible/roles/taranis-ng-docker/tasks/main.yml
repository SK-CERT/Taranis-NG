---
# taranis-ng-docker role: install Docker Engine + docker compose plugin
# idempotently on the target host. Supports both Debian/Ubuntu (apt) and
# RHEL-family (dnf) distributions.
#
# After installation, adds the configured users to the docker group and
# verifies the daemon is reachable. Uses only ansible.builtin modules — no
# collections and no Docker SDK are required on the target.

- name: "Abort on unsupported OS family"
  ansible.builtin.fail:
    msg: >-
      Unsupported OS family '{{ ansible_facts['os_family'] }}'.
      taranis-ng-docker supports Debian/Ubuntu and RedHat families.
  when: ansible_facts['os_family'] not in ['Debian', 'RedHat']

- name: "Include Debian/Ubuntu tasks"
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'

- name: "Include RedHat-family tasks"
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Run common post-install tasks"
  ansible.builtin.include_tasks: common.yml
