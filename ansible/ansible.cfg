[defaults]
# IMPORTANT: Ansible only reads ansible.cfg from the current working directory
# (or $ANSIBLE_CONFIG). Run every playbook from ansible/:
#
#     cd ansible && ansible-playbook playbooks/site.yml
#
# Running from the repository root loads none of this file: there would be no
# inventory (so `hosts: core` matches nothing and the play is silently skipped)
# and no roles_path (so the roles below are "not found").

# Default inventory: fully-local single-host. Works out of the box for the
# default all-in-one stack. Operators going distributed should pass
# `-i inventory/distributed.local.yml` on the command line (see
# ansible/inventory/README.md for the operator workflow).
inventory = inventory/localhost.yml

# Interpreter discovery — pick up Python 3 on the targets.
interpreter_python = auto_silent

# Facts are referenced as ansible_facts['os_family'], never as the injected
# top-level ansible_os_family. Injection is deprecated and goes away in
# ansible-core 2.24; turning it off now keeps the deprecation warning quiet and
# makes any stray top-level reference fail here rather than on that upgrade.
# Connection variables (ansible_user, ansible_host, ansible_become, …) are
# unaffected — they are not facts.
inject_facts_as_vars = False

# Host key checking off by default for convenience; operators who harden
# their known_hosts can re-enable per-environment.
host_key_checking = False

transport = ssh
roles_path = roles
forks = 10
timeout = 20

[ssh_connection]
retries = 3

[privilege_escalation]
# Both playbooks declare `become: true` per play; no global setting, so
# delegate_to: localhost tasks do not sudo on the control host.
become_method = sudo
