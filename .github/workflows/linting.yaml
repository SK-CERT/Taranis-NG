name: Linting

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code linting and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 2 so the PR merge commit's parents are available for the
          # changed-files diff in the ruff lint step below.
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .github/python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # No `version:` on purpose - setup-uv reads [tool.uv] required-version from
          # the root pyproject.toml, keeping the uv pin in exactly one place.
          enable-cache: true
      - name: Install dev tools (ruff, djlint) from lockstepped dependency group
        run: uv sync --group dev --no-install-project
      - name: Run djlint lint
        run: uv run --group dev djlint src/presenters/templates src/gui-v3/index.html --lint --ignore=H021
      - name: Run ruff lint check (changed files only)
        if: github.event_name == 'pull_request'
        # The legacy codebase is not yet clean under select = ["ALL"], so lint
        # only the files this PR touches — the same incremental policy the
        # pre-commit ruff-check hook applies locally. HEAD is the PR merge
        # commit, so HEAD^1..HEAD is exactly the PR's diff against the base.
        run: |
          changed=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- 'src/**/*.py' 'src/**/*.wsgi')
          if [ -n "$changed" ]; then
            echo "$changed" | xargs uv run --group dev ruff check --no-fix
          else
            echo "No Python changes to lint."
          fi
      - name: Run ruff format check
        run: uv run --group dev ruff format --check --diff

  check-locks:
    name: Verify uv.lock files are up to date
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # "." is the root workspace lock (dev tool group + the shared member).
        directory: ['.', src/bots, src/collectors, src/core, src/presenters, src/publishers]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check uv.lock is up to date
        working-directory: ${{ matrix.directory }}
        run: uv lock --check

  check-shared:
    name: Verify src/shared dependency pins match service locks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shared deps are reflected in all service uv.lock files
        run: |
          set -euo pipefail
          # src/shared is a uv workspace member with no uv.lock of its own; its
          # dependency pins flow into the 5 service locks via [tool.uv.sources].
          # Verify each shared dep pin matches the version recorded in every
          # service uv.lock so a shared bump that isn't relocked gets caught.
          python3 scripts/check_shared_lock_consistency.py

  ansible-checks:
    name: Ansible syntax check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Depth 2 so HEAD^1..HEAD is the PR diff (matches the lint job above).
          fetch-depth: 2
      - name: Skip if no ansible-related files changed
        # These checks only matter when ansible/ or its check script changes —
        # saves CI minutes on PRs that don't touch the deployment machinery.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only --diff-filter=ACMR HEAD^1 HEAD -- \
              'ansible/' \
              'scripts/check_ansible_syntax.py' \
              '.github/workflows/linting.yaml')
          else
            # workflow_dispatch or push: always run.
            changed=" ansible/  (forced)"
          fi
          if [ -z "$changed" ]; then
            echo "No ansible-related files changed; skipping Ansible checks."
            echo "SKIP_ANSIBLE_CHECK=1" >> "$GITHUB_ENV"
          else
            echo "Ansible-related files changed:"
            echo "$changed"
          fi
      - name: Set up Python
        if: env.SKIP_ANSIBLE_CHECK != '1'
        uses: actions/setup-python@v7
        with:
          python-version-file: .github/python-version
      - name: Install uv
        if: env.SKIP_ANSIBLE_CHECK != '1'
        uses: astral-sh/setup-uv@v6
        with:
          # No `version:` on purpose - setup-uv reads [tool.uv] required-version from
          # the root pyproject.toml, keeping the uv pin in exactly one place.
          enable-cache: true
      - name: Install Ansible tooling from the locked dependency group
        if: env.SKIP_ANSIBLE_CHECK != '1'
        # Versions come from [dependency-groups] ansible in pyproject.toml and
        # uv.lock, so CI and .venv run the identical ansible-core/ansible-lint.
        run: uv sync --group dev --group ansible --no-install-project
      - name: Syntax-check and lint playbooks
        if: env.SKIP_ANSIBLE_CHECK != '1'
        # Same entry point as the ansible-tests pre-commit hook, so CI and local runs
        # cannot drift. It runs check_ansible_syntax.py first (which provisions the
        # collections cache under .cache/) and then ansible-lint --offline against that
        # cache. --require turns the local "skip when ansible-core is absent" behaviour
        # into a hard failure here, where the previous step has just installed it.
        run: uv run --group ansible python3 scripts/run_tests.py --suite ansible --require
