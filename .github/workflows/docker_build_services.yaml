name: Docker images - services

# Replaces docker_build_{bots,collectors,core,presenters,publishers}.yaml.
# `plan` works out which service images a push to main affects (its src/ folder,
# its Dockerfile and start scripts, or src/shared, which every image bundles;
# see dynamic-monorepo.config.json) and only those are built and pushed.
on:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.docker }}
      has_services: ${{ steps.plan.outputs.has_docker }}
    steps:
      - uses: actions/checkout@v7
      - uses: Continuous-Actions/dynamic-monorepo@v1
        id: plan

  build:
    name: build docker (${{ matrix.service }})
    needs: plan
    if: needs.plan.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: get ghcr owner repository
        run: |
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/taranis-ng-${{ matrix.service }}:${{ github.ref_name }}
