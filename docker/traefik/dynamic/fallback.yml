# Fallback only - not where you configure this.
#
# Response headers, TLS and HSTS are edited in the GUI (Configuration ->
# Application Settings -> Routing & TLS) and served to Traefik by core. This file
# holds the shipped defaults for one case only: the catch-all router names this
# middleware, and that router must keep working while core is down - so it cannot
# come from core. Edits here are invisible to the GUI.
#
# No tls.options/tls.stores: those are not namespaced per provider, and a second
# definition fails every router with "unknown TLS options: default".
#
# No Strict-Transport-Security: HSTS is its own middleware ("taranis-hsts"), and
# the catch-all must not pin hostnames it serves on the default certificate.
#
# Traefik merges every *.yml here; other files are gitignored.

http:
  middlewares:
    public-web-security-headers:
      headers:
        customResponseHeaders:
          X-Frame-Options: "SAMEORIGIN"
          X-Robots-Tag: "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
          X-Content-Type-Options: "nosniff"
          Permissions-Policy: >-
            accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(),
            document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(),
            geolocation=(), gyroscope=(), keyboard-map=(), magnetometer=(), microphone=(), midi=(), navigation-override=(), payment=(),
            picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(),
            xr-spatial-tracking=(), clipboard-read=(), clipboard-write=(), gamepad=(), speaker-selection=(), conversion-measurement=(),
            focus-without-user-activation=(), hid=(), idle-detection=(), interest-cohort=(), serial=(), sync-script=(),
            trust-token-redemption=(), window-placement=(), vertical-scroll=()
          Referrer-Policy: "strict-origin-when-cross-origin"
          Cross-Origin-Embedder-Policy: "require-corp"
          Cross-Origin-Resource-Policy: "same-origin"
          Cross-Origin-Opener-Policy: "same-origin"
          Content-Security-Policy: >-
            default-src 'self'; font-src https://cdn.jsdelivr.net:443 'self'; script-src https://cdn.jsdelivr.net:443 'self' 'unsafe-inline';
            script-src-elem https://cdn.jsdelivr.net:443 'self' 'unsafe-inline'; style-src-attr 'self' 'unsafe-inline';
            style-src-elem https://cdn.jsdelivr.net:443 'self' 'unsafe-inline'; img-src 'self' data: blob:;
            frame-ancestors 'self'; frame-src 'self'
