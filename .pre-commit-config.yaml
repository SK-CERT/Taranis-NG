repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/djlint/djLint
    rev: v1.44.2
    hooks:
      - id: djlint
        files: "^(src/presenters/templates/.*\\.(html|jinja|j2)|src/gui-v3/index\\.html)$"
        args: ["--ignore=H021"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Docker Compose YAMLs use the !override / !reset / !reset tag extensions (e.g.
        # `ports: !override` to REPLACE rather than APPEND) that PyYAML cannot construct.
        # Skip them here — they are validated by `docker compose config` (which knows the
        # custom tags) during `scripts/test-setup.sh` runs and CI.
        exclude: '^docker/docker-compose.*\.yml$'
      - id: end-of-file-fixer
        exclude: '.*\.(example|svg|yml|j2)$'
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: check-tool-versions-lockstep
        name: Dev tool version lockstep (pyproject / pre-commit / CI)
        entry: scripts/check_tool_versions.py
        language: python
        pass_filenames: false
        always_run: true
      - id: check-version-lockstep
        name: Release version lockstep (VERSION.md / pyprojects / package.json)
        entry: scripts/bump_version.py --check
        language: python
        pass_filenames: false
        always_run: true
      # Every test hook below goes through scripts/run_tests.py, which is also what CI
      # runs — so a suite cannot pass locally and be invoked differently in CI. Each one
      # is gated by `files:` so a commit only pays for the suites it can affect, and each
      # SKIPS when its tooling is absent (CI adds --require to make that fatal instead).
      - id: ansible-tests
        name: Ansible syntax check and lint
        entry: scripts/run_tests.py --suite ansible
        language: python
        pass_filenames: false
        files: ^(ansible/.*\.(yml|yaml|j2)|scripts/check_ansible_syntax\.py)$
        always_run: false
      - id: python-tests
        name: Python unit tests (pytest)
        entry: scripts/run_tests.py --suite pytest
        language: python
        pass_filenames: false
        files: ^src/(core|shared|bots|collectors|presenters|publishers)/.*\.py$
        always_run: false
      - id: gui3-precommit
        name: GUI lint-staged and unit tests (Vitest)
        entry: node src/gui-v3/scripts/precommit.cjs
        language: system
        pass_filenames: false
        # Was always_run: true, which ran the whole Vitest suite with coverage on every
        # commit — including Python-only, ansible-only and docs-only ones.
        files: ^src/gui-v3/
        always_run: false
