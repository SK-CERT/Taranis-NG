server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # block dotfiles (hidden files) from being served
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Hashed assets (JS/CSS chunks) — cache 1 year, return 404 for missing (never fall back to index.html)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated because the add_header above stops the server-level ones from
        # being inherited into this block.
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # index.html — must never be cached so browsers always fetch fresh chunk references after a deploy
    location = /index.html {
        alias /usr/share/nginx/html/index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # SPA routing — all other paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    server_tokens off;

    include /etc/nginx/conf.d/security-headers.inc;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
