[project]
name = "taranis-ng-core"
version = "26.05.1"
description = "Taranis-NG Core service."
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.1",
    "Authlib==1.7.2",
    "beautifulsoup4==4.15.0",
    "cryptography==50.0.0",
    "defusedxml==0.7.1",
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "Flask-JWT-Extended==4.7.4",
    "Flask-Migrate==4.1.0",
    "flask-oidc==2.4.0",
    "Flask-RESTful==0.3.10",
    "Flask-SQLAlchemy==3.1.1",
    "gevent==26.8.0",
    "gunicorn==26.2.0",
    "Jinja2==3.1.6",
    "ldap3==2.10.2rc4",
    "lxml==6.1.2",
    "minisaml==26.1",
    "marshmallow==4.3.1",
    "psycopg[binary]==3.3.4",
    "pycryptodomex==3.23.0",
    "PyJWT==2.13.0",
    "pyotp==2.10.0",
    "python-dotenv==1.2.3",
    "python-keycloak==7.1.1",
    "webauthn==3.0.0",
    "redis==8.1.0",
    "requests==2.34.2",
    "schedule==1.2.2",
    "sseclient-py==1.9.0",
    "SQLAlchemy==2.0.51",
    "tqdm==4.70.0",
    "Werkzeug==3.1.8",
    "langchain==1.3.16",
    "langchain-openai==1.6.0",
    "pycountry==26.2.16",
    "taranis-ng-shared==26.05.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The core modules import as top-level packages (auth.*, model.*, managers.*),
# so the package root must be importable when pytest runs from here.
pythonpath = ["."]

[tool.uv.sources]
taranis-ng-shared = { path = "../shared" }
