[project]
name = "taranis-ng-publishers"
version = "26.05.1"
description = "Taranis-NG Publishers service."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "envelope==2.3.1",
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "Flask-RESTful==0.3.10",
    "gevent==26.8.0",
    "gunicorn==26.0.0",
    "marshmallow==4.3.1",
    "Mastodon.py==2.2.1",
    "paramiko==5.0.0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "tweepy==4.17.0",
    "urllib3==2.7.0",
    "pymisp==2.5.34.2",
    "taranis-ng-shared==26.05.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The publishers modules import as top-level packages (api.*, publishers.*,
# crypto.*), so the package root must be importable when pytest runs from here.
pythonpath = ["."]

[tool.uv.sources]
taranis-ng-shared = { path = "../shared" }
