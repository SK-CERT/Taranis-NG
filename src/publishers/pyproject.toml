[project]
name = "taranis-ng-publishers"
version = "26.10.1"
description = "Taranis-NG Publishers service."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    # Never 2.4.0: it reports a delivered e-mail as failed (CZ-NIC/envelope#57, fixed
    # in 2.4.1). Not below 2.4.2 either: older releases cache SMTP connections they
    # should drop - a failed one (#60, fixed in 2.4.1) fails every later send to that
    # server until restart, and a closed one costs each later send a 3 s retry (2.4.2).
    # tests/test_email_publisher_delivery.py drives the real library to catch both.
    "envelope==2.4.2",
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "Flask-RESTful==0.3.10",
    "packaging==26.3",
    "gevent==26.9.0",
    "gunicorn==26.2.0",
    "marshmallow==4.3.1",
    "Mastodon.py==2.2.1",
    "paramiko==5.0.0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "tweepy==4.17.0",
    "urllib3==2.8.0",
    "pymisp==2.5.34.4",
    "taranis-ng-shared==26.10.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The publishers modules import as top-level packages (api.*, publishers.*,
# crypto.*), so the package root must be importable when pytest runs from here.
pythonpath = ["."]

[tool.uv.sources]
taranis-ng-shared = { path = "../shared" }
