[project]
name = "taranis-ng-publishers"
version = "26.05.1"
description = "Taranis-NG Publishers service."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    # Pinned below 2.4.0: that release refactored delivery into _deliver_now() and
    # turned "no recipient was refused" into a failure - smtplib.send_message()
    # returns an empty dict when every recipient was accepted, and _send_now() does
    # `if not success: return False`, so a delivered e-mail reports bool(Envelope())
    # False. Every send then logs "Email sending failed" although the mail went out.
    # Upstream: https://github.com/CZ-NIC/envelope/issues/57 (2.3.1 handles it).
    "envelope==2.3.1",
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "Flask-RESTful==0.3.10",
    "packaging==26.3",
    "gevent==26.9.0",
    "gunicorn==26.2.0",
    "marshmallow==4.3.1",
    "Mastodon.py==2.2.1",
    "paramiko==5.0.0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "tweepy==4.17.0",
    "urllib3==2.7.0",
    "pymisp==2.5.34.3",
    "taranis-ng-shared==26.05.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The publishers modules import as top-level packages (api.*, publishers.*,
# crypto.*), so the package root must be importable when pytest runs from here.
pythonpath = ["."]

[tool.uv.sources]
taranis-ng-shared = { path = "../shared" }
