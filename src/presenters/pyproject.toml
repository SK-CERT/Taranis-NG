[project]
name = "taranis-ng-presenters"
version = "26.05.1"
description = "Taranis-NG Presenters service."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "cvss==3.6",
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "Flask-RESTful==0.3.10",
    "gevent==26.8.0",
    "gunicorn==26.0.0",
    "Jinja2==3.1.6",
    "marshmallow==4.3.1",
    "python-dotenv==1.2.3",
    "weasyprint==69.0",
    "taranis-ng-shared==26.05.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The presenters modules import as top-level packages (api.*, presenters.*,
# template_migrations.*), so the package root must be importable when pytest
# runs from here.
pythonpath = ["."]

[tool.uv.sources]
taranis-ng-shared = { path = "../shared" }
