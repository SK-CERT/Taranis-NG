[project]
name = "taranis-ng-bots"
version = "26.05.1"
description = "Taranis-NG Bots service."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "Flask-RESTful==0.3.10",
    "gevent==26.8.0",
    "gunicorn==26.0.0",
    "marshmallow==4.3.1",
    "oauthlib==3.3.1",
    "PySocks==1.7.1",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "schedule==1.2.2",
    "sseclient-py==1.9.0",
    "taranis-ng-shared==26.05.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The bots modules import as top-level packages (api.*, bots.*, managers.*),
# so the package root must be importable when pytest runs from here.
pythonpath = ["."]

[tool.uv.sources]
taranis-ng-shared = { path = "../shared" }
