[project]
name = "TARANIS-NG-public-web"
version = "26.10.1"
description = "Taranis-NG Public Web service."
requires-python = ">=3.10"
dependencies = [
    "bleach[css]==6.4.0",
    "cachelib==0.14.0",
    "cvss==3.6",
    "envelope==2.4.2",
    "feedgen==1.0.0",
    "Flask==3.1.3",
    "gevent==26.5.0",
    "gunicorn==26.0.0",
    "packaging==26.2",
    "requests==2.34.2",
    "taranis-ng-shared==26.10.1"
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Run from src/public_web (scripts/run_tests.py cds here). The tests import the app,
# so scripts/dev_setup.py installs the dependencies above into the root .venv.
testpaths = ["tests"]
